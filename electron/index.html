<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Caixa de Supermercado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <div class="lado-esquerdo">
      <img src="logo.png" alt="Logo do Mercado" class="logo">
      <div id="relogio" class="relogio">00:00:00 00/00/0000</div>
    </div>

    <div class="lado-direito">
      <div class="display" id="lista-produtos"></div>
      <div class="total" id="total-geral">Total: R$ 0,00</div>
      <div class="controls">
        <input type="text" id="codigo-barra" placeholder="Digite ou escaneie o código de barras" autofocus />
        <button onclick="finalizarVenda()">Finalizar Venda</button>
      </div>
    </div>
  </div>

  <script>
    const lista = document.getElementById('lista-produtos');
    const totalView = document.getElementById('total-geral');
    const input = document.getElementById('codigo-barra');

    let produtos = [];
    let total = 0;

    const produtosFake = {
      "7891234567890": { nome: "Arroz 5kg", valor: 25.99 },
      "7899876543210": { nome: "Feijão 1kg", valor: 8.50 },
      "7890001112223": { nome: "Macarrão", valor: 4.75 }
    };

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const codigo = input.value.trim();
        const produto = produtosFake[codigo];

        if (produto) {
          produtos.push(produto);
          total += produto.valor;
          atualizarTela();
        } else {
          alert("Produto não encontrado");
        }

        input.value = '';
      }
    });

    function atualizarTela() {
      lista.innerHTML = '';
      produtos.forEach((p) => {
        const div = document.createElement('div');
        div.classList.add('produto');
        div.innerHTML = `<span>${p.nome}</span><span>R$ ${p.valor.toFixed(2)}</span>`;
        lista.appendChild(div);
      });

      totalView.innerText = `Total: R$ ${total.toFixed(2)}`;
    }

    function finalizarVenda() {
      if (produtos.length === 0) return alert("Nenhum produto para finalizar.");
      alert("Venda finalizada!");
      produtos = [];
      total = 0;
      atualizarTela();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.electronAPI.confirmarSaida();
      }
    });

    // ⏰ Relógio
    function atualizarRelogio() {
      const agora = new Date();
      const hora = agora.toLocaleTimeString('pt-BR');
      const data = agora.toLocaleDateString('pt-BR');
      document.getElementById('relogio').innerText = `${hora} ${data}`;
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();
  </script>
</body>
</html>
